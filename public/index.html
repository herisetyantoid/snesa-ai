<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNESA AI</title><style>:root{--p:#1769aa;--bg:#f4f7fb;--card:#fff;--line:#e4e9f0}*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:#172033}header{background:linear-gradient(135deg,#0b4f7c,#1769aa);color:#fff;padding:28px 6vw}.brand{font-size:30px;font-weight:800}.tag{opacity:.9}.wrap{max-width:1180px;margin:28px auto;padding:0 20px;display:grid;grid-template-columns:1.35fr .8fr;gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px #102a4310}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{font-size:13px;font-weight:700}input,select,textarea{width:100%;margin-top:6px;padding:11px;border:1px solid #d5dce5;border-radius:10px;font:inherit}textarea{min-height:80px}.full{grid-column:1/-1}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#eef5fb;color:#0b4f7c}.actions{display:flex;gap:9px;margin-top:15px}.result{margin-top:18px;border-top:1px solid var(--line);padding-top:18px;white-space:pre-wrap;line-height:1.6}.chatlog{height:390px;overflow:auto;background:#f8fafc;border-radius:12px;padding:10px}.msg{padding:10px;margin:7px 0;border-radius:10px;white-space:pre-wrap}.me{background:#e8f2fb}.ai{background:#fff;border:1px solid var(--line)}.chatrow{display:flex;gap:7px}.chatrow input{margin:0}.quick{display:grid;gap:8px;margin-top:10px}.quick button{text-align:left}.status{font-size:13px;color:#667085;margin-top:7px}@media(max-width:850px){.wrap{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div id="login" style="position:fixed;inset:0;background:#f4f7fb;display:flex;align-items:center;justify-content:center;z-index:9"><div class="card" style="max-width:420px;width:92%"><h2>🔐 Akses SNESA AI</h2><p>Masukkan kode akses guru yang diberikan sekolah.</p><input id="access" type="password" placeholder="Kode akses"><button class="btn primary" style="margin-top:10px;width:100%" id="loginBtn">Masuk</button><div id="loginMsg" class="status"></div></div></div><header><div class="brand">SNESA AI</div><div class="tag">Platform Pembelajaran Pintar • SMP Negeri 1 Ambarawa</div></header><main class="wrap"><section class="card"><h2>✨ Generator Pembelajaran</h2><div class="grid"><label>Jenis Dokumen<select id="jenis"><option>RPP / Modul Ajar</option><option>LKPD</option><option>Asesmen / Soal</option><option>Program Pembelajaran</option></select></label><label>Tahun Ajaran<input id="tahun" value="2026/2027"></label><label>Sekolah<input id="sekolah" value="SMP Negeri 1 Ambarawa"></label><label>Mata Pelajaran<input id="mapel" placeholder="Contoh: IPA"></label><label>Kelas<input id="kelas" placeholder="Contoh: VIII"></label><label>Alokasi Waktu<input id="waktu" placeholder="Contoh: 2 JP"></label><label class="full">Materi / Topik<input id="materi" placeholder="Contoh: Tekanan zat"></label><label>Model Pembelajaran<input id="model" placeholder="PBL / inkuiri"></label><label>Dimensi Profil Lulusan<input id="dpl" placeholder="Tuliskan dimensi"></label><label class="full">Prinsip Pembelajaran Mendalam<textarea id="prinsip" placeholder="Berkesadaran, bermakna, menggembirakan..."></textarea></label><label class="full">Konteks / Kondisi Kelas<textarea id="konteks" placeholder="Kemampuan awal, fasilitas, karakter siswa, dll."></textarea></label></div><div class="actions"><button class="btn primary" id="gen">✨ GENERATE DENGAN AI</button><button class="btn secondary" id="copy">Salin Hasil</button><button class="btn secondary" id="print">Cetak / PDF</button></div><div class="status" id="status"></div><div class="result" id="result">Hasil dokumen akan muncul di sini.</div></section><aside class="card"><h2>🤖 Guru SNESA</h2><div id="chatlog" class="chatlog"><div class="msg ai">Assalamu'alaikum. Saya Guru SNESA. Ada yang ingin Bapak/Ibu siapkan?</div></div><div class="chatrow"><input id="chat" placeholder="Tanyakan sesuatu..."><button class="btn primary" id="send">Kirim</button></div><h3>Ide cepat</h3><div class="quick"><button class="btn secondary q">Buat penjelasan sederhana</button><button class="btn secondary q">Buat pembelajaran diferensiasi</button><button class="btn secondary q">Buat ide praktikum sederhana</button><button class="btn secondary q">Buat pesan untuk wali murid</button></div></aside></main><script>const $=id=>document.getElementById(id);let history=[];const code=localStorage.getItem("snesa_access")||"";if(code)$("login").style.display="none";$("loginBtn").onclick=()=>{const v=$("access").value.trim();if(!v){$("loginMsg").textContent="Kode akses wajib diisi.";return}localStorage.setItem("snesa_access",v);$("login").style.display="none"};$("gen").onclick=async()=>{let d={};["jenis","tahun","sekolah","mapel","kelas","materi","waktu","model","dpl","prinsip","konteks"].forEach(id=>d[id]=$(id).value);$("status").textContent="Sedang menyusun...";try{let r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json","x-snesa-code":localStorage.getItem("snesa_access")||""},body:JSON.stringify(d)}),j=await r.json();if(!r.ok)throw Error(j.error);$("result").textContent=j.text;$("status").textContent="Selesai."}catch(e){$("status").textContent="Gagal: "+e.message}};$("copy").onclick=()=>navigator.clipboard.writeText($("result").textContent);$("print").onclick=()=>{const w=window.open("","_blank");w.document.write("<pre style=\"white-space:pre-wrap;font:14px system-ui;padding:30px\">"+esc($("result").textContent)+"</pre>");w.print()};async function ask(m){$("chatlog").insertAdjacentHTML("beforeend",'<div class="msg me">'+esc(m)+"</div>");$("chat").value="";try{let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json","x-snesa-code":localStorage.getItem("snesa_access")||""},body:JSON.stringify({message:m,history})}),j=await r.json();if(!r.ok)throw Error(j.error);$("chatlog").insertAdjacentHTML("beforeend",'<div class="msg ai">'+esc(j.text)+"</div>");history.push({role:"user",content:m},{role:"assistant",content:j.text})}catch(e){$("chatlog").insertAdjacentHTML("beforeend",'<div class="msg ai">Gagal: '+esc(e.message)+"</div>")}}$("send").onclick=()=>{$("chat").value.trim()&&ask($("chat").value.trim())};$("chat").onkeydown=e=>{if(e.key==="Enter")$("send").click()};document.querySelectorAll(".q").forEach(b=>b.onclick=()=>ask(b.textContent));function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}</script></body></html>
