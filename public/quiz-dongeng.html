<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Kuku & Nana | SNESA AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#eef2ff,#f5f3ff,#ecfeff);color:#172033;min-height:100vh}.wrap{max-width:820px;margin:auto;padding:24px 16px}.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 15px 45px #17203318;margin-bottom:18px}.hero{background:linear-gradient(135deg,#172554,#4c1d95 55%,#0f766e);color:white;text-align:center;overflow:hidden}.friends{font-size:64px;margin:4px}.badge{display:inline-block;background:#ffffff22;border:1px solid #ffffff44;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:800}.btn{border:0;border-radius:14px;padding:13px 20px;font:inherit;font-weight:850;cursor:pointer}.start{background:#fff;color:#4c1d95;font-size:17px}.primary{background:#6d28d9;color:white}.secondary{background:#ede9fe;color:#5b21b6}.top{display:flex;justify-content:space-between;gap:10px;font-weight:800}.progress{height:11px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:12px 0 20px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#06b6d4);transition:.3s}.question{font-size:23px;font-weight:850;line-height:1.45;margin:8px 0 20px}.options{display:grid;gap:11px}.option{border:2px solid #e5e7eb;background:#fff;border-radius:15px;padding:14px 16px;text-align:left;font:inherit;font-weight:700;cursor:pointer}.option:hover{border-color:#8b5cf6;background:#faf5ff}.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b}.feedback{margin-top:14px;padding:13px;border-radius:13px;font-weight:750}.good{background:#ecfdf3;color:#166534}.bad{background:#fff7ed;color:#9a3412}.score{width:155px;height:155px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:18px auto;background:#f3e8ff;box-shadow:0 10px 35px #4c1d9530}.score b{font-size:40px;color:#6d28d9}.tip{background:#f8f7ff;border:1px dashed #c4b5fd;border-radius:14px;padding:13px;color:#5b21b6}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:18px}@media(max-width:600px){.question{font-size:19px}.friends{font-size:48px}}
</style>
</head>
<body>
<div class="wrap">
<section class="card hero">
<span class="badge">🌙 QUIZ CERITA SNESA AI</span>
<div class="friends">🐱 ✨ 🪲</div>
<h1>Kuku & Nana: Cahaya Persahabatan</h1>
<p>Yuk uji pemahamanmu tentang dongeng Kuku si Kucing dan Nana si Kunang-Kunang!</p>
<button class="btn start" onclick="startQuiz()">🌟 MULAI QUIZ</button>
<p style="font-size:12px;opacity:.8">10 soal • nilai otomatis • backsound malam</p>
</section>
<div id="app"></div>
</div>
<script>
const questions=[
['Siapakah tokoh utama dalam dongeng?',['Kuku si Kucing dan Nana si Kunang-Kunang','Budi si Burung dan Kiki si Kelinci','Mimi si Kucing dan Lala si Lebah','Kuku si Anjing dan Nana si Kupu-Kupu'],0],
['Apa yang paling ditakuti Kuku?',['Hujan','Gelap','Air','Petir'],1],
['Apa yang membuat Nana tampak seperti lampu kecil?',['Bulu di tubuhnya','Sayapnya yang putih','Cahaya dari tubuhnya','Batu yang dibawanya'],2],
['Apa yang terjadi ketika angin bertiup sangat kencang?',['Kuku tertidur','Nana tersangkut di semak','Rumah Kuku roboh','Bulan menjadi sangat terang'],1],
['Mengapa Kuku berani mencari Nana?',['Karena ingin bermain','Karena disuruh teman','Karena Nana membutuhkan pertolongan','Karena ingin mengejar kupu-kupu'],2],
['Apa yang dilakukan Kuku untuk membebaskan Nana?',['Memanggil burung','Menunggu sampai pagi','Menarik dan menyingkirkan ranting semak','Terbang mencari bantuan'],2],
['Menurut Kuku, apa arti keberanian?',['Tidak pernah merasa takut','Berani melakukan hal yang benar meskipun takut','Selalu menjadi yang paling kuat','Tidak membutuhkan bantuan siapa pun'],1],
['Siapa yang mereka bantu setelah Nana bebas?',['Anak burung yang kebingungan','Anak kelinci','Seekor ikan','Kupu-kupu'],0],
['Apa pesan tentang persahabatan dalam cerita?',['Sahabat harus selalu menang','Sahabat hanya bermain bersama','Sahabat saling menolong dan menguatkan','Sahabat tidak boleh berbeda'],2],
['Apa pelajaran utama dari dongeng Kuku dan Nana?',['Malam harus selalu dihindari','Kita tidak boleh berjalan malam','Kita boleh takut, tetapi tetap berusaha melakukan kebaikan','Kunang-kunang lebih hebat daripada kucing'],2]
];
let i=0,score=0,locked=false,ctx,gain;
function sound(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();gain=ctx.createGain();gain.gain.value=.035;gain.connect(ctx.destination);loopSound()}catch(e){}}
function loopSound(){if(!ctx)return;[261.63,329.63,392,329.63,293.66,349.23,440,349.23].forEach((n,k)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=n;g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(.11,ctx.currentTime+k*.7+.12);g.gain.linearRampToValueAtTime(0,ctx.currentTime+k*.7+.62);o.connect(g);g.connect(gain);o.start(ctx.currentTime+k*.7);o.stop(ctx.currentTime+k*.7+.7)});setTimeout(loopSound,5600)}
function stopSound(){if(gain)gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.5)}
function startQuiz(){i=0;score=0;locked=false;sound();render()}
function render(){let q=questions[i];document.getElementById('app').innerHTML='<section class="card"><div class="top"><span>🌟 Soal '+(i+1)+' dari 10</span><span>⭐ '+score+' benar</span></div><div class="progress"><span style="width:'+(i*10)+'%"></span></div><div class="question">'+q[0]+'</div><div class="options">'+q[1].map((x,j)=>'<button class="option" onclick="answer('+j+')">'+String.fromCharCode(65+j)+'. '+x+'</button>').join('')+'</div><div id="feedback"></div><div class="actions"><button id="next" class="btn primary" style="display:none" onclick="next()"> '+(i===9?'🏆 Lihat Nilai':'Soal Berikutnya →')+'</button></div></section>'}
function answer(n){if(locked)return;locked=true;let q=questions[i],buttons=document.querySelectorAll('.option');buttons.forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');if(j===n&&n!==q[2])b.classList.add('wrong')});let f=document.getElementById('feedback');if(n===q[2]){score++;f.className='feedback good';f.textContent='🎉 Benar! Hebat sekali!'}else{f.className='feedback bad';f.textContent='💡 Belum tepat. Jawaban yang benar: '+q[1][q[2]]+'.'}document.getElementById('next').style.display='inline-block'}
function next(){if(i<9){i++;locked=false;render()}else finish()}
function finish(){stopSound();let nilai=score*10;let msg=nilai===100?'Luar biasa! Kamu sangat memahami cerita! 🌟':nilai>=80?'Hebat! Pesan cerita sudah kamu pahami dengan baik! ✨':nilai>=60?'Bagus! Baca kembali ceritanya dan coba lagi. 🌙':'Tidak apa-apa. Yuk baca kembali dongengnya dan coba lagi! 🐱';document.getElementById('app').innerHTML='<section class="card" style="text-align:center"><div style="font-size:38px">🌟✨🌟</div><h2>Quiz Selesai!</h2><div class="score"><b>'+score+'/10</b></div><h2>Nilai Kamu: '+nilai+'</h2><p>'+msg+'</p><div class="tip">💖 <b>Pesan moral:</b> kita boleh merasa takut, tetapi tetap berusaha melakukan kebaikan dan menolong teman.</div><div class="actions"><button class="btn primary" onclick="startQuiz()">🔄 Main Lagi</button><button class="btn secondary" onclick="location.reload()">🏠 Kembali</button></div></section>'}
</script>
</body>
</html>
